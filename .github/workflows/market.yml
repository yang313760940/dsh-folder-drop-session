name: Publish market index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build plugin client bundle
        run: node scripts/build.mjs
      - name: Build market index from the pushed commit
        run: node scripts/build-market.mjs --commit "$GITHUB_SHA"
      - name: Validate index
        run: node market/validate.mjs market-dist/index.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: market-dist
      - name: Deploy index
        id: deployment
        uses: actions/deploy-pages@v4
